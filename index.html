<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>Interactive Map | Mohamed Ait Abdelmalik</title>

  <!-- ArcGIS embeddable components -->
  <script type="module" src="https://js.arcgis.com/5.0/embeddable-components/"></script>

  <style>
    :root {
      --bg: #0b1020;
      --card: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.12);
      --text: #eef2ff;
      --muted: #9aa4c7;
      --accent: #4fc3f7;
      --accent-2: #a78bfa;
      --radius: 20px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 500px at 10% -10%, rgba(79, 195, 247, 0.18), transparent 60%),
        radial-gradient(800px 500px at 100% 0%, rgba(167, 139, 250, 0.18), transparent 60%),
        var(--bg);
      min-height: 100vh;
      min-height: 100dvh;
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
               max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      display: flex;
      justify-content: center;
    }

    .wrap {
      width: 100%;
      max-width: 1280px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ---------- Header ---------- */
    .hero {
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 18px 22px;
      align-items: center;
      padding: clamp(18px, 3vw, 30px);
      border-radius: var(--radius);
      background: var(--card);
      border: 1px solid var(--border);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: -40% -10% auto auto;
      width: 380px;
      height: 380px;
      background: conic-gradient(from 90deg, var(--accent), var(--accent-2), var(--accent));
      filter: blur(90px);
      opacity: 0.22;
      pointer-events: none;
      animation: spin 18s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .avatar {
      width: clamp(60px, 9vw, 92px);
      aspect-ratio: 1;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: clamp(22px, 3.4vw, 34px);
      color: #08111f;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.08), 0 8px 24px rgba(79, 195, 247, 0.35);
      position: relative;
      z-index: 1;
    }

    .intro { position: relative; z-index: 1; min-width: 0; }

    .eyebrow {
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
    }

    h1 {
      font-size: clamp(22px, 4.2vw, 40px);
      line-height: 1.15;
      margin: 4px 0 6px;
      font-weight: 700;
      background: linear-gradient(90deg, #fff, #c7d2fe 60%, var(--accent));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .sub { color: var(--muted); font-size: clamp(13px, 1.6vw, 16px); }

    /* ---------- Links ---------- */
    .links {
      grid-column: 1 / -1;
      position: relative;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;           /* comfortable touch target */
      padding: 10px 16px;
      border-radius: 999px;
      text-decoration: none;
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:hover, .btn:focus-visible {
      transform: translateY(-2px);
      background: rgba(79, 195, 247, 0.16);
      border-color: var(--accent);
      box-shadow: 0 8px 22px rgba(79, 195, 247, 0.2);
      outline: none;
    }

    .btn.primary {
      color: #08111f;
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
    }

    .btn svg { width: 18px; height: 18px; fill: currentColor; flex: none; }

    /* ---------- Map ---------- */
    .map-card {
      position: relative;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
      background: #0e1530;
      box-shadow: 0 14px 50px rgba(0, 0, 0, 0.45);
    }

    arcgis-embedded-map {
      display: block;
      width: 100%;
      height: clamp(420px, 68vh, 760px);
    }

    .badge {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 2;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 999px;
      color: var(--text);
      background: rgba(11, 16, 32, 0.7);
      border: 1px solid var(--border);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      pointer-events: none;
    }

    /* ---------- Footer ---------- */
    footer {
      text-align: center;
      color: var(--muted);
      font-size: 12.5px;
      padding: 4px 8px 8px;
    }

    footer a { color: var(--accent); text-decoration: none; }

    /* ---------- Phones ---------- */
    @media (max-width: 640px) {
      .hero { grid-template-columns: 1fr; text-align: center; justify-items: center; }
      .links { justify-content: center; }
      .btn { flex: 1 1 calc(50% - 10px); justify-content: center; }
      .btn.primary { flex-basis: 100%; }
      arcgis-embedded-map { height: 72vh; height: 72dvh; min-height: 420px; }
      .badge { display: none; }
    }

    /* Landscape phones */
    @media (max-height: 480px) and (orientation: landscape) {
      arcgis-embedded-map { height: 85vh; }
    }

    @media (prefers-reduced-motion: reduce) {
      .hero::before { animation: none; }
      .btn { transition: none; }
    }
  </style>
</head>

<body>
  <main class="wrap">

    <header class="hero">
      <div class="avatar" aria-hidden="true">MA</div>

      <div class="intro">
        <div class="eyebrow">Interactive Map Presentation</div>
        <h1>Mohamed Ait Abdelmalik</h1>
        <p class="sub">Explore the map: zoom, switch basemaps, open the legend and bookmarks.</p>
      </div>

      <nav class="links" aria-label="Contact links">
        <a class="btn primary" href="mailto:mohamed.aitabdelmalik@gmail.com">
          <svg viewBox="0 0 24 24"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/></svg>
          Email me
        </a>

        <!-- TODO: replace the "#" with your real links -->
        <a class="btn" href="#" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9.75h4V21H3zM9.5 9.75h3.8v1.6h.06c.53-1 1.82-2.05 3.75-2.05 4 0 4.74 2.63 4.74 6.05V21h-4v-5.05c0-1.2-.02-2.75-1.68-2.75-1.68 0-1.94 1.31-1.94 2.66V21h-4z"/></svg>
          LinkedIn
        </a>

        <a class="btn" href="#" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24"><path d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.52-1.33-1.28-1.69-1.28-1.69-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.42-2.7 5.4-5.27 5.68.41.36.78 1.06.78 2.15v3.19c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .5z"/></svg>

        <a class="btn" href="#" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm6.9 9h-3.1a15.6 15.6 0 0 0-1.3-5.2A8 8 0 0 1 18.9 11zM12 4c.8 1 1.7 3 2 7H10c.3-4 1.2-6 2-7zM9.5 5.8A15.6 15.6 0 0 0 8.2 11H5.1a8 8 0 0 1 4.4-5.2zM5.1 13h3.1c.1 1.9.5 3.7 1.3 5.2A8 8 0 0 1 5.1 13zM12 20c-.8-1-1.7-3-2-7h4c-.3 4-1.2 6-2 7zm2.5-1.8c.8-1.5 1.2-3.3 1.3-5.2h3.1a8 8 0 0 1-4.4 5.2z"/></svg>
          Portfolio
        </a>
      </nav>
    </header>

    <section class="map-card" aria-label="Interactive map">
      <div class="badge">🗺️ Live ArcGIS map</div>

      <arcgis-embedded-map
        item-id="c6bba9139c434434ac13c92939ae3593"
        portal-url="https://ucd-cpe.maps.arcgis.com"
        theme="dark"
        center="8.95201728722591,51.32168639217287"
        scale="9244648.868618"
        bookmarks-enabled
        heading-enabled
        legend-enabled
        information-enabled
        basemap-gallery-enabled
        time-zone-label-enabled>
      </arcgis-embedded-map>
    </section>

    <footer>
      Map data © ArcGIS · Presentation by
      <a href="mailto:mohamed.aitabdelmalik@gmail.com">Mohamed Ait Abdelmalik</a>
    </footer>

  </main>
</body>
</html>
